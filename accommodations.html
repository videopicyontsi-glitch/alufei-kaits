<script>
  const CLOUDINARY_CLOUD = 'dbe0swkki';
  const CLOUDINARY_PRESET = 'יהונתן';
  const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`;

  async function uploadToCloudinary(file, folder) {
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', CLOUDINARY_PRESET);
    fd.append('folder', folder || 'accommodations');
    // apply grayscale + auto quality in Cloudinary
    fd.append('transformation', JSON.stringify([{ effect: 'grayscale' }, { quality: 'auto' }]));
    const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: fd });
    if (!res.ok) throw new Error('שגיאת העלאה');
    const data = await res.json();
    return {
      url: data.secure_url,
      publicId: data.public_id,
      fileName: file.name
    };
  }

  // build a grayscale Cloudinary URL from any existing URL
  function toGrayscaleUrl(url) {
    if (!url || !url.includes('cloudinary.com')) return url;
    return url.replace('/upload/', '/upload/e_grayscale,q_auto/');
  }
</script>

function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
let db = loadDB();

// ============================================================
// AUTH
// ============================================================
let currentRole = 'admin';
let currentUser = null; // teacher obj or 'admin' or student name

function setRole(r) {
  currentRole = r;
  document.querySelectorAll('.role-tab').forEach((t,i) => t.classList.toggle('active', ['admin','teacher','parent'][i] === r));
  document.getElementById('loginLabel').textContent = r === 'admin' ? 'שם מנהל' : r === 'teacher' ? 'שם מורה' : 'שם תלמיד';
  document.getElementById('loginError').style.display = 'none';
}

function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');
  db = loadDB();

  if (currentRole === 'admin') {
    if (name === db.admin.name && pass === db.admin.password) { currentUser = 'admin'; showApp(); return; }
  } else if (currentRole === 'teacher') {
    const t = db.teachers.find(t => t.name === name && t.password === pass);
    if (t) { currentUser = t; showApp(); return; }
  } else {
    const s = db.students.find(s => s.name === name && s.parentPassword === pass);
    if (s) { currentUser = s; showApp(); return; }
  }
  err.style.display = 'block';
}

function logout() {
  currentUser = null;
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginName').value = '';
  document.getElementById('loginPass').value = '';
}

function showApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const name = currentRole === 'admin' ? db.admin.name : currentRole === 'teacher' ? currentUser.name : currentUser.name;
  document.getElementById('topbarName').textContent = name;
  document.getElementById('topbarAvatar').textContent = name.charAt(0);
  buildSidebar();
  if (currentRole === 'admin') renderAdminDashboard();
  else if (currentRole === 'teacher') renderTeacherDashboard();
  else renderParentDashboard();
}

// ============================================================
// SIDEBAR
// ============================================================

  const sidebar = document.getElementById('sidebar');

  if (currentRole === 'admin') {
    items = [
      { icon: '📊', label: 'לוח בקרה', fn: 'renderAdminDashboard' },
      { icon: '👩‍🏫', label: 'מורים', fn: 'renderAdminTeachers' },
      { icon: '🧑‍🎓', label: 'תלמידים', fn: 'renderAdminStudents' },
      { icon: '📅', label: 'לוח מבחנים', fn: 'renderAdminExams' },
      { icon: '🏆', label: 'ציונים', fn: 'renderAdminGrades' },
      { icon: '📈', label: 'התקדמות', fn: 'renderAdminProgress' },
    ];
  } else if (currentRole === 'teacher') {
    items = [
      { icon: '📊', label: 'לוח בקרה', fn: 'renderTeacherDashboard' },
      { icon: '🧑‍🎓', label: 'התלמידים שלי', fn: 'renderTeacherStudents' },
      { icon: '📅', label: 'מועדי בחינות', fn: 'renderTeacherExams' },
      { icon: '📁', label: 'מסמכים', fn: 'renderTeacherDocs' },
    ];
  } else {
    items = [
      { icon: '📊', label: 'סטטוס', fn: 'renderParentDashboard' },
      { icon: '📅', label: 'בחינות קרובות', fn: 'renderParentExams' },
      { icon: '👩‍🏫', label: 'המורים שלי', fn: 'renderParentTeachers' },
    ];
  }
  sidebar.innerHTML = items.map(it =>
    `<div class="nav-item" onclick="${it.fn}()" id="nav_${it.fn}">
      <span class="nav-icon">${it.icon}</span>${it.label}
    </div>`
  ).join('');
  buildBottomNav(items);
}

function setActiveNav(fn) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const el = document.getElementById('nav_' + fn);
  if (el) el.classList.add('active');
  // sync bottom nav
  document.querySelectorAll('.bottom-nav-item').forEach(n => n.classList.remove('active'));
  const bn = document.getElementById('bn_' + fn);
  if (bn) bn.classList.add('active');
}

function buildBottomNav(items) {
  const nav = document.getElementById('bottomNav');
  if (!nav) return;
  nav.innerHTML = items.map(it =>
    `<button class="bottom-nav-item" onclick="${it.fn}()" id="bn_${it.fn}">
      <span class="bn-icon">${it.icon}</span>
      <span>${it.label}</span>
    </button>`
  ).join('');
}

function setContent(html) {
  document.getElementById('mainContent').innerHTML = html;
}

// ============================================================
// UTILS
// ============================================================
function daysUntil(dateStr) {
  const d = new Date(dateStr) - new Date();
  return Math.ceil(d / 86400000);
}
function fmtDate(d) {
  if (!d) return '—';
  const dd = new Date(d);
  return dd.toLocaleDateString('he-IL');
}
function uid() { return '_' + Math.random().toString(36).substr(2,9); }
function studentsOfTeacher(tid) { return db.students.filter(s => s.teacherIds.includes(tid)); }
function teacherById(id) { return db.teachers.find(t => t.id === id); }
function studentById(id) { return db.students.find(s => s.id === id); }
function examHasDocs(e) {
  return (e.originalExam && e.originalExam.fileName) || (e.comparativeExam && e.comparativeExam.fileName);
}
function uploadProgress(student) {
  const total = student.exams.length;
  if (!total) return 0;
  const done = student.exams.filter(e => examHasDocs(e)).length;
  return Math.round(done / total * 100);
}
function waLink(phone, msg) {
  const p = phone.replace(/\D/g,'');
  return `https://wa.me/972${p.startsWith('0') ? p.slice(1) : p}?text=${encodeURIComponent(msg)}`;
}

  t.name = document.getElementById('et_name').value.trim();
  t.phone = document.getElementById('et_phone').value.trim();
  t.subjects = document.getElementById('et_subjects').value.trim();
  t.password = document.getElementById('et_pass').value.trim();
  saveDB(db);
  closeModal();
  renderAdminTeachers();
}

function deleteTeacher(id) {
  if (!confirm('למחוק מורה זה?')) return;
  db.teachers = db.teachers.filter(t => t.id !== id);
  db.students.forEach(s => s.teacherIds = s.teacherIds.filter(t => t !== id));

function addStudent() {
  const accs = [...document.querySelectorAll('input[name="acc_new"]:checked')].map(c => c.value);
  const tids = [...document.querySelectorAll('input[name="teacher_new"]:checked')].map(c => c.value);
  const s = {
    id: uid(),
    name: document.getElementById('as_name').value.trim(),
    class: document.getElementById('as_class').value.trim(),
    parentPhone: document.getElementById('as_phone').value.trim(),
    parentPassword: document.getElementById('as_pass').value.trim(),
    accommodations: accs,
    teacherIds: tids,
    exams: []
  };
  if (!s.name || !s.parentPassword) return alert('שם וסיסמת הורה הם שדות חובה');
  db.students.push(s);
  saveDB(db);
  closeModal();
  renderAdminStudents();
}

function openEditStudent(id) {
  const s = studentById(id);
  openModal(`

    <div class="form-row">

      <div class="form-group"><label>כיתה</label><input class="form-control" id="es_class" value="${s.class||''}"></div>

    <div class="form-row">

      <div class="form-section-title">התאמות</div>

function editStudent(id) {
  const s = studentById(id);
  s.name = document.getElementById('es_name').value.trim();
  s.class = document.getElementById('es_class').value.trim();
  s.parentPhone = document.getElementById('es_phone').value.trim();
  s.parentPassword = document.getElementById('es_pass').value.trim();
  s.accommodations = [...document.querySelectorAll('input[name="acc_edit"]:checked')].map(c => c.value);
  s.teacherIds = [...document.querySelectorAll('input[name="teacher_edit"]:checked')].map(c => c.value);
  saveDB(db);
  closeModal();
  renderAdminStudents();

function deleteStudent(id) {
  if (!confirm('למחוק תלמיד זה?')) return;
  db.students = db.students.filter(s => s.id !== id);
  saveDB(db);
  renderAdminStudents();
}

// quick inline phone edit for parent

function renderAdminExams() {
  setActiveNav('renderAdminExams');
  const allExams = db.students.flatMap(s =>
    s.exams.map(e => ({ ...e, studentId: s.id, studentName: s.name, studentPhone: s.parentPhone }))
  ).sort((a,b) => new Date(a.examDate) - new Date(b.examDate));

  setContent(`
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:center;">
      <div><h2>📅 לוח מבחנים</h2><p>כל הבחינות בכל התלמידים</p></div>
      <button class="btn btn-primary" onclick="openAdminAddExam()">+ הוסף בחינה</button>
    </div>
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>תלמיד</th><th>מורה</th><th>מקצוע</th><th>תאריך בחינה</th><th>מבחן משווה עד</th><th>ימים</th><th>מסמך</th><th>פעולות</th></tr></thead>
        <tbody>
          ${allExams.length === 0 ? `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px;">אין בחינות</td></tr>` :
            allExams.map(e => {
              const days = daysUntil(e.examDate);
              const cls = days <= 0 ? '' : days <= 3 ? 'days-urgent' : days <= 7 ? 'days-soon' : 'days-ok';
              const hasDocs = examHasDocs(e);
              const teacher = teacherById(e.teacherId);
              return `<tr>
                <td><strong>${e.studentName}</strong></td>
                <td>${teacher ? teacher.name : '—'}</td>
                <td>${e.subject}</td>
                <td>${fmtDate(e.examDate)}</td>
                <td>${fmtDate(e.preExamDate)}</td>
                <td class="${cls}"><strong>${days > 0 ? days + ' ימים' : days === 0 ? 'היום' : 'עבר'}</strong></td>
                <td><span class="badge ${hasDocs ? 'badge-green' : 'badge-red'}">${hasDocs ? '✅' : '⚠️'}</span></td>
                <td style="display:flex;gap:6px;flex-wrap:wrap;">
                  <button class="btn btn-sm btn-ghost" onclick="openAdminEditExam('${e.studentId}','${e.id}')">✏️ ערוך</button>
                  <button class="btn btn-sm btn-danger" onclick="adminDeleteExam('${e.studentId}','${e.id}')">🗑️</button>
                </td>
              </tr>`;
            }).join('')
          }
        </tbody>
      </table></div>
    </div>
  `);
}

          <option value="">בחר כיתה...</option>
          ${classes.map(c => `<option value="${c}">${c}</option>`).join('')}

    </div>
    <button class="btn btn-primary btn-block" onclick="adminAddExam()" style="margin-top:6px;">✅ הוסף בחינה ושלח הודעות</button>
  `);

function switchAddExamMode(mode) {
  addExamSelMode = mode;
  document.getElementById('aae_byName').style.display = mode === 'name' ? 'block' : 'none';
  document.getElementById('aae_byClass').style.display = mode === 'class' ? 'block' : 'none';
  document.querySelectorAll('.role-tab').forEach((t,i) => t.classList.toggle('active', ['name','class'][i] === mode));
}

function previewClassStudents() {
  const cls = document.getElementById('aae_class').value;
  const students = db.students.filter(s => s.class === cls);
  const el = document.getElementById('classStudentPreview');
  if (!cls || !students.length) { el.innerHTML = ''; return; }
  el.innerHTML = `<div style="background:var(--accent);border-radius:10px;padding:10px 14px;font-size:13px;">
    <strong>${students.length} תלמידים בכיתה ${cls}:</strong>
    ${students.map(s => `<span class="acc-tag" style="margin:2px;">${s.name}</span>`).join('')}
  </div>`;
}

function getSelectedStudentsForExam() {
  if (addExamSelMode === 'name') {
    return [...document.querySelectorAll('input[name="sel_student"]:checked')].map(c => studentById(c.value)).filter(Boolean);
  } else {
    const cls = document.getElementById('aae_class').value;
    return db.students.filter(s => s.class === cls);
  }
}

function adminAddExam() {
  const selectedStudents = getSelectedStudentsForExam();
  if (!selectedStudents.length) return alert('יש לבחור לפחות תלמיד אחד');
  const subject = document.getElementById('aae_subject').value.trim();
  const examDate = document.getElementById('aae_date').value;
  const preExamDate = document.getElementById('aae_pre').value;
  const teacherId = document.getElementById('aae_teacher').value;
  if (!subject || !examDate) return alert('מקצוע ותאריך הם שדות חובה');

  selectedStudents.forEach(s => {
    if (!s.appendices) s.appendices = [];
    s.exams.push({ id: uid(), subject, examDate, preExamDate, teacherId,
      originalExam: { fileName: null, url: null, grade: '' },
      comparativeExam: { fileName: null, url: null, grade: '', accommodationsUsed: [] }
    });
  });
  saveDB(db);

  // show WhatsApp notification modal
  openNotifyModal(selectedStudents, subject, examDate, preExamDate, teacherId);
}

function openNotifyModal(students, subject, examDate, preExamDate, teacherId) {
  const teacher = teacherById(teacherId);
  const teacherMsg = teacher
    ? `שלום ${teacher.name}, נקבעה בחינה חדשה: *${subject}* בתאריך ${fmtDate(examDate)}. יש להכין מבחן משווה עד ${fmtDate(preExamDate)||'—'} עבור התלמידים: ${students.map(s=>s.name).join(', ')}.`
    : '';

  const teacherBlock = teacher ? `
    <div style="background:var(--accent);border-radius:12px;padding:14px;margin-bottom:16px;">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;">📩 הודעה למורה — ${teacher.name}</div>
      <div style="font-size:12px;color:var(--muted);background:white;padding:8px;border-radius:8px;margin-bottom:8px;line-height:1.6;">${teacherMsg}</div>
      <a href="${waLink(teacher.phone, teacherMsg)}" target="_blank" class="btn btn-wa btn-block">📱 שלח וואצ׳אפ ל${teacher.name}</a>
    </div>` : '';

  const parentBlocks = students.filter(s => s.parentPhone).map(s => {
    const msg = `שלום הורי ${s.name}, נקבעה בחינה חדשה: *${subject}* בתאריך ${fmtDate(examDate)}.${preExamDate ? ' המורה יכין מבחן משווה עד ' + fmtDate(preExamDate) + '.' : ''} ניתן לעקוב אחר ההתקדמות במערכת.`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">
      <div>
        <strong>${s.name}</strong>
        <div style="font-size:12px;color:var(--muted);">📞 ${s.parentPhone}</div>
      </div>
      <a href="${waLink(s.parentPhone, msg)}" target="_blank" class="btn btn-wa btn-sm">📱 שלח</a>
    </div>`;
  }).join('');

  openModal(`
    <div class="modal-title">✅ הבחינה נוספה! שלח הודעות <button class="modal-close" onclick="closeModal();renderAdminExams();">✕</button></div>
    <div style="background:#dcfce7;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px;">
      <strong>הבחינה נוספה בהצלחה ל-${students.length} תלמידים:</strong>
      ${students.map(s=>`<span class="acc-tag" style="margin:2px;">${s.name}</span>`).join('')}
    </div>
    ${teacherBlock}
    ${parentBlocks ? `<div style="font-size:13px;font-weight:700;margin-bottom:10px;">📩 הודעות להורים:</div>${parentBlocks}` : ''}
    <button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="closeModal();renderAdminExams();">סגור</button>
  `);
}

let gradesFilter = { teacher: '', class: '', subject: '', hasGrade: 'all' };

function renderAdminGrades() {
  setActiveNav('renderAdminGrades');

  // build flat rows
  const rows = db.students.flatMap(s =>
    s.exams.map(e => {
      const teacher = teacherById(e.teacherId);
      const origGrade = e.originalExam && e.originalExam.grade ? e.originalExam.grade : '';
      const compGrade = e.comparativeExam && e.comparativeExam.grade ? e.comparativeExam.grade : '';
      const origNum = parseFloat(origGrade);
      const compNum = parseFloat(compGrade);
      const diff = (!isNaN(origNum) && !isNaN(compNum)) ? (compNum - origNum) : null;
      return {
        studentId: s.id, studentName: s.name, class: s.class || '',
        teacherName: teacher ? teacher.name : '—', subject: e.subject,
        examDate: e.examDate, preExamDate: e.preExamDate,
        origGrade, compGrade, diff,
        accommodations: s.accommodations,
        usedAccommodations: (e.comparativeExam && e.comparativeExam.accommodationsUsed) || [],
        hasOrigDoc: !!(e.originalExam && e.originalExam.fileName),
        hasCompDoc: !!(e.comparativeExam && e.comparativeExam.fileName),
      };
    })
  );

  // unique filter options
  const teachers = [...new Set(rows.map(r => r.teacherName))].filter(t => t !== '—');
  const classes  = [...new Set(rows.map(r => r.class))].filter(Boolean).sort();
  const subjects = [...new Set(rows.map(r => r.subject))].sort();

  // apply filters
  let filtered = rows.filter(r => {
    if (gradesFilter.teacher  && r.teacherName !== gradesFilter.teacher) return false;
    if (gradesFilter.class    && r.class !== gradesFilter.class) return false;
    if (gradesFilter.subject  && r.subject !== gradesFilter.subject) return false;
    if (gradesFilter.hasGrade === 'yes' && !r.compGrade) return false;
    if (gradesFilter.hasGrade === 'no'  && r.compGrade)  return false;
    return true;
  }).sort((a,b) => a.studentName.localeCompare(b.studentName, 'he'));

  // summary stats
  const withBoth = filtered.filter(r => r.diff !== null);
  const avgDiff  = withBoth.length ? (withBoth.reduce((s,r) => s + r.diff, 0) / withBoth.length).toFixed(1) : '—';
  const improved = withBoth.filter(r => r.diff > 0).length;

  setContent(`
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
      <div><h2>🏆 טבלת ציונים</h2><p>כל המבחנים, הציונים וההתאמות</p></div>
      <button class="btn btn-success" onclick="exportGradesToExcel()">⬇️ ייצוא Excel</button>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-card"><div class="stat-num">${filtered.length}</div><div class="stat-label">שורות בטבלה</div></div>
      <div class="stat-card"><div class="stat-num">${filtered.filter(r=>r.compGrade).length}</div><div class="stat-label">ציוני משווה הוזנו</div></div>
      <div class="stat-card"><div class="stat-num ${avgDiff > 0 ? '' : 'stat-num'}" style="color:${avgDiff > 0 ? 'var(--success)' : avgDiff < 0 ? 'var(--danger)' : 'var(--primary)'}">${avgDiff > 0 ? '+' : ''}${avgDiff}</div><div class="stat-label">ממוצע שיפור</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success);">${improved}</div><div class="stat-label">שיפרו ציון</div></div>
    </div>

    <!-- FILTERS -->
    <div class="card" style="padding:14px 18px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="margin-bottom:0;min-width:130px;">
          <label style="font-size:12px;">מורה</label>
          <select class="form-control" style="padding:8px;" onchange="gradesFilter.teacher=this.value;renderAdminGrades()">
            <option value="">הכל</option>
            ${teachers.map(t => `<option value="${t}" ${gradesFilter.teacher===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;min-width:110px;">
          <label style="font-size:12px;">כיתה</label>
          <select class="form-control" style="padding:8px;" onchange="gradesFilter.class=this.value;renderAdminGrades()">
            <option value="">הכל</option>
            ${classes.map(c => `<option value="${c}" ${gradesFilter.class===c?'selected':''}>${c}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;min-width:140px;">
          <label style="font-size:12px;">מקצוע</label>
          <select class="form-control" style="padding:8px;" onchange="gradesFilter.subject=this.value;renderAdminGrades()">
            <option value="">הכל</option>
            ${subjects.map(s => `<option value="${s}" ${gradesFilter.subject===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div class="form-group" style="margin-bottom:0;min-width:140px;">
          <label style="font-size:12px;">ציון משווה</label>
          <select class="form-control" style="padding:8px;" onchange="gradesFilter.hasGrade=this.value;renderAdminGrades()">
            <option value="all" ${gradesFilter.hasGrade==='all'?'selected':''}>הכל</option>
            <option value="yes" ${gradesFilter.hasGrade==='yes'?'selected':''}>הוזן בלבד</option>
            <option value="no"  ${gradesFilter.hasGrade==='no' ?'selected':''}>חסר בלבד</option>
          </select>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="gradesFilter={teacher:'',class:'',subject:'',hasGrade:'all'};renderAdminGrades()">🔄 אפס</button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
        <table id="gradesTable">
          <thead>
            <tr style="background:var(--bg);">
              <th>תלמיד</th>
              <th>כיתה</th>
              <th>מורה</th>
              <th>מקצוע</th>
              <th>תאריך</th>
              <th>ציון מבחן</th>
              <th>ציון משווה</th>
              <th>הפרש</th>
              <th>מסמכים</th>
              <th>התאמות כלליות</th>

          </thead>
          <tbody>

              ? `<tr><td colspan="11" style="text-align:center;color:var(--muted);padding:32px;">אין נתונים</td></tr>`
              : filtered.map(r => {
                  const diffStr = r.diff !== null ? (r.diff > 0 ? '+'+r.diff : String(r.diff)) : '—';
                  const diffColor = r.diff === null ? '' : r.diff > 0 ? 'color:var(--success);font-weight:700;' : r.diff < 0 ? 'color:var(--danger);font-weight:700;' : '';
                  return `<tr>
                    <td><strong>${r.studentName}</strong></td>
                    <td><span class="badge badge-blue">${r.class||'—'}</span></td>

                    </td>
                    <td style="text-align:center;">
                      ${r.compGrade

                        : `<span style="color:var(--danger);">⚠️ חסר</span>`}
                      ${r.hasCompDoc ? ' 📄' : ''}
                    </td>
                    <td style="text-align:center;${diffColor}">${diffStr}</td>

                  </tr>`;
                }).join('')
            }

        </table>
      </div>
    </div>
  `);
}

function exportGradesToExcel() {
  const rows = db.students.flatMap(s =>
    s.exams.map(e => {
      const teacher = teacherById(e.teacherId);
      const origGrade = e.originalExam && e.originalExam.grade ? e.originalExam.grade : '';
      const compGrade = e.comparativeExam && e.comparativeExam.grade ? e.comparativeExam.grade : '';
      const origNum = parseFloat(origGrade);
      const compNum = parseFloat(compGrade);
      const diff = (!isNaN(origNum) && !isNaN(compNum)) ? (compNum - origNum) : '';
      return {
        'שם תלמיד':           s.name,
        'כיתה':               s.class || '',
        'מורה':               teacher ? teacher.name : '',
        'מקצוע':              e.subject,
        'תאריך בחינה':        fmtDate(e.examDate),
        'מבחן משווה עד':      fmtDate(e.preExamDate),
        'ציון מבחן רגיל':     origGrade,
        'ציון מבחן משווה':    compGrade,
        'הפרש':               diff !== '' ? diff : '',
        'מסמך רגיל הועלה':    (e.originalExam && e.originalExam.fileName) ? 'כן' : 'לא',
        'מסמך משווה הועלה':   (e.comparativeExam && e.comparativeExam.fileName) ? 'כן' : 'לא',
        'התאמות כלליות':      s.accommodations.join(', '),
        'התאמות שהשתמשו':     ((e.comparativeExam && e.comparativeExam.accommodationsUsed) || []).join(', '),
        'טלפון הורה':         s.parentPhone || '',
      };
    })
  ).sort((a,b) => a['שם תלמיד'].localeCompare(b['שם תלמיד'], 'he'));

  const ws = XLSX.utils.json_to_sheet(rows, { header: Object.keys(rows[0] || {}) });

  // column widths
  ws['!cols'] = [
    {wch:18},{wch:8},{wch:14},{wch:12},{wch:14},{wch:14},
    {wch:14},{wch:14},{wch:8},{wch:12},{wch:14},{wch:40},{wch:40},{wch:14}
  ];

  // RTL direction for sheet
  if (!ws['!sheetView']) ws['!sheetView'] = {};
  ws['!sheetViews'] = [{ rightToLeft: true }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'ציונים והתאמות');

  // summary sheet
  const summary = db.teachers.map(t => {
    const students = studentsOfTeacher(t.id);
    const exams = students.flatMap(s => s.exams.filter(e => e.teacherId === t.id));
    const withComp = exams.filter(e => e.comparativeExam && e.comparativeExam.grade);
    const nums = withComp.map(e => {
      const o = parseFloat(e.originalExam && e.originalExam.grade);
      const c = parseFloat(e.comparativeExam && e.comparativeExam.grade);
      return (!isNaN(o) && !isNaN(c)) ? c - o : null;
    }).filter(d => d !== null);
    const avg = nums.length ? (nums.reduce((a,b) => a+b, 0) / nums.length).toFixed(1) : '';
    return {
      'מורה':            t.name,
      'טלפון':           t.phone,
      'תלמידים':         students.length,
      'בחינות':          exams.length,
      'ציוני משווה הוזנו': withComp.length,
      'ממוצע שיפור':     avg,
    };
  });

  if (summary.length) {
    const ws2 = XLSX.utils.json_to_sheet(summary);
    ws2['!cols'] = [{wch:16},{wch:14},{wch:10},{wch:10},{wch:18},{wch:14}];
    ws2['!sheetViews'] = [{ rightToLeft: true }];
    XLSX.utils.book_append_sheet(wb, ws2, 'סיכום מורים');
  }

  const today = new Date().toLocaleDateString('he-IL').replace(/\//g,'-');
  XLSX.writeFile(wb, `ציונים_והתאמות_${today}.xlsx`);
}

function downloadAsPDF(url, fileName) {
  if (!url) return alert('אין קובץ להורדה');
  if (!window.jspdf) { window.open(url, '_blank'); return; }
  const { jsPDF } = window.jspdf;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function() {
    const orientation = img.width > img.height ? 'l' : 'p';
    const pdf = new jsPDF({ orientation, unit: 'px', format: [img.width, img.height] });
    pdf.addImage(img, 'JPEG', 0, 0, img.width, img.height);
    pdf.save((fileName || 'מסמך').replace(/\.[^.]+$/, '') + '.pdf');
  };
  img.onerror = () => window.open(url, '_blank');
  img.src = toGrayscaleUrl(url);
}

async function processAndPreviewDoc(event, sid, eid, tab) {
  const file = event.target.files[0];
  if (!file) return;
  const zone = document.getElementById('uploadZone');
  if (zone) zone.innerHTML = '<div class="upload-icon">⏳</div><p>מעלה ל-Cloudinary...</p>';

  try {
    const result = await uploadToCloudinary(file, `accommodations/${sid}`);
    const wrap = document.getElementById('docPreviewWrap');
    const img = document.getElementById('docPreviewImg');
    if (wrap && img) {
      img.src = toGrayscaleUrl(result.url);
      wrap.style.display = 'block';
    }
    if (zone) zone.style.display = 'none';
    window._pendingDocUpload = result;
  } catch(err) {
    if (zone) zone.innerHTML = '<div class="upload-icon">❌</div><p>שגיאה בהעלאה — נסה שוב</p>';
    console.error(err);
  }
}

function saveDocData(sid, eid, tab) {
  const s = studentById(sid);
  const e = s.exams.find(ex => ex.id === eid);
  const isComp = tab === 'comparative';
  const examObj = isComp ? e.comparativeExam : e.originalExam;

  if (window._pendingDocUpload) {
    examObj.url = window._pendingDocUpload.url;
    examObj.publicId = window._pendingDocUpload.publicId;
    examObj.fileName = window._pendingDocUpload.fileName;
    window._pendingDocUpload = null;
  }
  examObj.grade = (document.getElementById('docGradeInput') || {}).value || examObj.grade;

  if (isComp) {
    examObj.accommodationsUsed = [...document.querySelectorAll('input[name="used_acc"]:checked')].map(c => c.value);
  }
  saveDB(db);
  closeModal();
  renderTeacherDocs();
}

function clearExamFile(sid, eid, tab) {
  if (!confirm('למחוק קובץ זה?')) return;
  const s = studentById(sid);
  const e = s.exams.find(ex => ex.id === eid);
  const obj = tab === 'comparative' ? e.comparativeExam : e.originalExam;
  obj.fileName = null; obj.url = null; obj.publicId = null;
  saveDB(db);
  renderTeacherDocs();
}

async function processAppendix(event, sid) {
  const file = event.target.files[0];
  if (!file) return;
  const wrap = document.getElementById('appPreviewWrap');
  const img = document.getElementById('appPreviewImg');
  if (wrap) wrap.innerHTML = '<p style="padding:8px;color:var(--muted);">⏳ מעלה...</p>';

  try {
    const result = await uploadToCloudinary(file, `accommodations/${sid}/appendices`);
    window._pendingAppendix = result;
    if (wrap && img) {
      wrap.innerHTML = '';
      wrap.appendChild(img);
      img.src = toGrayscaleUrl(result.url);
      wrap.style.display = 'block';
    }
  } catch(err) {
    if (wrap) wrap.innerHTML = '<p style="color:var(--danger);">❌ שגיאה בהעלאה</p>';
    console.error(err);
  }
}

function saveAppendix(sid) {
  if (!window._pendingAppendix) return alert('יש לבחור קובץ תחילה');
  const s = studentById(sid);
  if (!s.appendices) s.appendices = [];
  s.appendices.push({
    id: uid(),
    teacherId: currentUser.id,
    fileName: window._pendingAppendix.fileName,
    url: window._pendingAppendix.url,
    publicId: window._pendingAppendix.publicId,
    note: (document.getElementById('appNote')||{}).value || ''
  });
  window._pendingAppendix = null;
  saveDB(db);
  closeModal();
  renderTeacherDocs();
}

function removeAppendix(sid, aid) {
  const s = studentById(sid);
  s.appendices = (s.appendices||[]).filter(a => a.id !== aid);
  saveDB(db);
}

function renderParentExams() {
  setActiveNav('renderParentExams');
  const s = currentUser;
  const sorted = [...s.exams].sort((a,b) => new Date(a.examDate) - new Date(b.examDate));

  setContent(`
    <div class="page-header"><h2>📅 בחינות קרובות</h2><p>לוח בחינות של ${s.name}</p></div>
    ${sorted.map(e => {
      const days = daysUntil(e.examDate);
      const cls = days <= 3 ? 'days-urgent' : days <= 7 ? 'days-soon' : 'days-ok';
      const hasDocs = examHasDocs(e);
      const t = teacherById(e.teacherId);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-size:18px;font-weight:800;">${e.subject}</div>
            ${t ? `<div style="font-size:13px;color:var(--muted);">מורה: ${t.name}</div>` : ''}
            <div style="font-size:13px;margin-top:8px;">📅 תאריך בחינה: <strong>${fmtDate(e.examDate)}</strong></div>
            <div style="font-size:13px;">📝 מבחן משווה עד: <strong>${fmtDate(e.preExamDate)}</strong></div>
          </div>
          <div style="text-align:left;">
            <div class="${cls}" style="font-size:24px;font-weight:800;">${days > 0 ? days : '—'}</div>
            <div style="font-size:12px;color:var(--muted);">ימים</div>
          </div>
        </div>
        <div style="margin-top:12px;display:flex;align-items:center;gap:10px;">
          <span class="badge ${hasDocs?'badge-green':'badge-red'}">${hasDocs?'✅ מסמך הועלה':'⚠️ מסמך לא הועלה'}</span>
          ${!hasDocs && days <= 7 ? `<span class="badge badge-yellow">⏰ נא לפנות למורה</span>` : ''}
        </div>
      </div>`;
    }).join('') || '<div class="empty-state"><div class="empty-icon">📅</div><p>אין בחינות רשומות</p></div>'}
  `);
}
