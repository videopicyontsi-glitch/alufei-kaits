<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a5f3d">
<title>פנקס מפק״ץ — כניסה</title>
<style>
  :root{--green:#0f9d63;--green-d:#0c7a4e;--green-dd:#0a5f3d;--navy:#16223a;--bg:#f3f5f8;--card:#ffffff;--ink:#141b27;--muted:#71798a;--line:#eceff3;--fail:#e0533d;--shadow-lg:0 6px 18px rgba(20,40,30,.08),0 20px 48px rgba(20,40,30,.10);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif;background:linear-gradient(160deg,var(--green-dd),var(--navy));color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;line-height:1.55}
  .wrap{width:100%;max-width:400px}
  .brand{text-align:center;color:#fff;margin-bottom:22px}
  .brand .logo{width:90px;height:90px;border-radius:22px;margin:0 auto 14px;overflow:hidden;background:rgba(255,255,255,.12);padding:6px}
  .brand .logo img{width:100%;height:100%;object-fit:contain;border-radius:16px}
  .brand b{font-size:26px;font-weight:800;display:block;letter-spacing:-.4px}
  .brand span{font-size:13px;opacity:.85}
  .card{background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow-lg)}
  .card h2{margin:0 0 20px;font-size:19px;font-weight:800;color:var(--ink)}
  label.fld{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--muted)}
  input{font-family:inherit;font-size:15px;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fafbfc;color:var(--ink);transition:.15s}
  input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(15,157,99,.13)}
  .btn{display:flex;width:100%;justify-content:center;align-items:center;border:none;background:linear-gradient(135deg,var(--green-d),var(--green));color:#fff;padding:15px;border-radius:14px;font-size:15px;font-weight:800;box-shadow:0 6px 16px rgba(15,157,99,.28);margin-top:22px;cursor:pointer;transition:transform .12s}
  .btn:active{transform:scale(.98)}
  .err{background:#fdeeeb;color:var(--fail);border:1px solid #f6d2cb;padding:11px 14px;border-radius:12px;font-size:13px;font-weight:600;margin-top:14px;display:none}
  .err.on{display:block}
  .note{font-size:12px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo"><img src="https://res.cloudinary.com/dbe0swkki/image/upload/v1782150047/pinkus/logo.jpg" alt="לוגו"></div>
    <b>קק״צ מילואים<br>במערך הסיוע מנהלתי קרבי</b>
    <span style="font-size:12px;opacity:.9;font-weight:600">הקק״צ הכי מקצועי בצה״ל</span>
    <span style="font-size:11px;opacity:.75;margin-top:4px;display:block">תוכנת עזר ללווי קורס הקצינים מקצה לקצה</span>
  </div>
  <div class="card">
    <h2>כניסה למערכת</h2>
    <label class="fld">שם משתמש</label>
    <input id="li-user" autocomplete="username" placeholder="הזן שם משתמש">
    <label class="fld">סיסמה</label>
    <input id="li-pass" type="password" autocomplete="current-password" placeholder="הזן סיסמה">
    <button class="btn" onclick="doLogin()">כניסה</button>
    <div id="err" class="err"></div>
    <div class="note">גישה למערכת מוגבלת לחברי הקורס בלבד.<br>לקבלת פרטי כניסה פנה למפקד הקורס.</div>
  </div>
</div>
<script>
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('on');}
function hideErr(){document.getElementById('err').classList.remove('on');}
function redirect(role){location.href=role==='commander'?'/pinkus/commander':role==='mefakatz'?'/pinkus/mefakatz':'/pinkus/tzaer';}
async function doLogin(){
  hideErr();
  const username=document.getElementById('li-user').value.trim();
  const password=document.getElementById('li-pass').value;
  if(!username||!password){showErr('יש למלא שם משתמש וסיסמה');return;}
  const r=await fetch('/api/pinkus/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  if(!r.ok){showErr('שם משתמש או סיסמה שגויים');return;}
  const u=await r.json();redirect(u.role);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
(async()=>{try{const r=await fetch('/api/pinkus/me');if(r.ok){const u=await r.json();redirect(u.role);}}catch(e){}})();
</script>
</body>
</html>
